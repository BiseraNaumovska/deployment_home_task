name: Database RESTORE

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Path to SQL file for restore (Empty for the latest backup)'
        required: false
        default: ''
        type: string

jobs:
  database-restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL Service in CI
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          docker compose -f docker-compose/docker-compose.yml up -d postgres_db
          until docker exec postgres_db pg_isready -U db_admin -d active_network_db; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Verify Data Count BEFORE RESTORE
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker exec postgres_db psql -U db_admin -d active_network_db -c "SELECT COUNT(*) FROM active_network_equipment;"

      - name: Run Restore Script
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ./docker-compose/restore.sh "${{ github.event.inputs.backup_file }}"

      - name: Verify Data Count AFTER RESTORE
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker exec postgres_db psql -U db_admin -d active_network_db -c "SELECT COUNT(*) FROM active_network_equipment;"
