name: Rollback Production (Main Branch)

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rollback Main to Previous Production Tag
        run: |
          PROD_TAGS=$(git tag --list "prod.*" --sort=-creatordate)
          
          PREV_TAG=$(echo "$PROD_TAGS" | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            echo "Error: No previous production tag found to rollback to!"
            exit 1
          fi

          echo "Rolling back 'main' branch to tag: $PREV_TAG"

          git checkout main
          git reset --hard $PREV_TAG
          git push --force origin main