---
- name: Deploy and Secure Remote Server Stack
  hosts: "{{ target_group | default('remote_server') }}"
  become: true
  vars:
    local_compose_dir: "{{ playbook_dir }}/../docker-compose"
    remote_compose_dir: "/opt/deployment_home_task/docker-compose"

  tasks:
    - name: Check if SSH config file exists
      stat:
        path: /etc/ssh/sshd_config
      register: sshd_config_file

    - name: Disable SSH Password Authentication for security
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      when: sshd_config_file.stat.exists
      notify: Restart SSH

    - name: Ensure PermitRootLogin relies on keys
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
        state: present
      when: sshd_config_file.stat.exists
      notify: Restart SSH

    - name: Install Docker runtime packages
      apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      service:
        name: docker
        enabled: true
        state: started

    - name: Ensure remote project directory exists
      file:
        path: "{{ remote_compose_dir }}"
        state: directory
        mode: '0755'

    - name: Copy Docker Compose stack to remote host
      copy:
        src: "{{ local_compose_dir }}/"
        dest: "{{ remote_compose_dir }}/"
        mode: preserve

    - name: Deploy Docker Compose stack
      command: docker compose up -d
      args:
        chdir: "{{ remote_compose_dir }}"

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
