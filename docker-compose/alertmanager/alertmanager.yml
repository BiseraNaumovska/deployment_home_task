global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.mail.yahoo.com:587'
  smtp_from: '${SMTP_FROM_EMAIL}'
  smtp_auth_username: '${SMTP_FROM_EMAIL}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: 'email-notifications'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: '${SMTP_FROM_EMAIL}'
        send_resolved: true
        headers:
          subject: ' Alert: {{ .CommonAnnotations.summary }}'
