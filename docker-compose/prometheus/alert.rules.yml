groups:
  - name: server_alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU usage above 80%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage above 80%"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk free space below 15%"

      - alert: WebserverDown
        expr: probe_success{job=~"blackbox_http|blackbox_https"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Nginx Webserver is unreachable!"
